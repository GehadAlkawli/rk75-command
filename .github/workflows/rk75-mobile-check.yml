name: RK75 Mobile checks

on:
  push:
    paths:
      - 'rk75-mobile/**'
      - '.github/workflows/rk75-mobile-check.yml'
  pull_request:
    paths:
      - 'rk75-mobile/**'
      - '.github/workflows/rk75-mobile-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rk75-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rk75-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo-doctor
