name: RK75 Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rk75-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rk75-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Prepare permanent release files
        id: release_files
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            release_tag="${{ github.ref_name }}"
          else
            release_tag="mobile-v${{ github.run_number }}"
          fi
          release_version="${release_tag#mobile-v}"
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/RK75-Command-${release_version}.apk"
          sha256sum "release/RK75-Command-${release_version}.apk" > "release/RK75-Command-${release_version}.apk.sha256"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RK75-Android-APK-${{ steps.release_files.outputs.version }}
          path: rk75-mobile/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish permanent GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_files.outputs.tag }}
          name: RK75 Command ${{ steps.release_files.outputs.version }}
          generate_release_notes: true
          files: |
            rk75-mobile/release/RK75-Command-${{ steps.release_files.outputs.version }}.apk
            rk75-mobile/release/RK75-Command-${{ steps.release_files.outputs.version }}.apk.sha256
