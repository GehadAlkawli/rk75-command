name: RK75 Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64-v8a
            asset_suffix: ARM64
          - architecture: armeabi-v7a
            asset_suffix: ARM32
    defaults:
      run:
        working-directory: rk75-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rk75-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build a standalone device-optimized release APK
        run: |
          cd android
          chmod +x gradlew
          # Release builds embed the JavaScript bundle. Debug APKs expect a
          # Metro development server and cannot run independently on a phone.
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=${{ matrix.architecture }}
      - name: Prepare architecture-specific APK
        id: release_files
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            release_tag="${{ github.ref_name }}"
          else
            release_tag="mobile-v${{ github.run_number }}"
          fi
          release_version="${release_tag#mobile-v}"
          mkdir -p release
          apk_name="RK75-Command-${release_version}-${{ matrix.asset_suffix }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release/${apk_name}"
          sha256sum "release/${apk_name}" > "release/${apk_name}.sha256"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RK75-Android-APK-${{ steps.release_files.outputs.version }}-${{ matrix.asset_suffix }}
          path: rk75-mobile/release/
          if-no-files-found: error
          retention-days: 30
  publish-release:
    needs: build-apk
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download device APKs
        uses: actions/download-artifact@v4
        with:
          pattern: RK75-Android-APK-*
          path: release
          merge-multiple: true
      - name: Resolve release version
        id: release
        run: |
          release_tag="${{ github.ref_name }}"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#mobile-v}" >> "$GITHUB_OUTPUT"
      - name: Publish permanent GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: RK75 Command ${{ steps.release.outputs.version }}
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.apk.sha256
