name: RK75 Mobile cloud build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: rk75-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rk75-mobile/package-lock.json
      - run: npm ci
      - name: Verify build credential
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN to this repository's GitHub Actions secrets before running a cloud build."
            exit 1
          fi
      - name: Start EAS cloud build
        run: npx eas-cli@latest build --non-interactive --no-wait --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}"
